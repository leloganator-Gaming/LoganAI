name: Build and deploy LoganAI browser model
on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "tests/**"
      - "loganai/**"
      - "data/train_corpus.txt"
      - "export_onnx.py"
      - "requirements-export.txt"
      - "GITHUB_PAGES_MIGRATION.md"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tests/**"
      - "loganai/**"
      - "data/train_corpus.txt"
      - "export_onnx.py"
      - "requirements-export.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check browser JavaScript syntax
        run: node --check docs/app.js
      - name: Test hybrid engines
        run: |
          node --check docs/core/orchestrator.js
          node --check docs/core/conversation-engine.js
          node --check docs/core/knowledge-engine.js
          node --check docs/core/memory-engine.js\n          node --check docs/core/neural-engine.js
          node --check docs/app.js
          node --test tests/orchestrator.test.cjs tests/engines.test.cjs tests/memory-engine.test.cjs tests/neural-engine.test.cjs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-export.txt
      - name: Install model export and validation dependencies
        run: python -m pip install -r requirements-export.txt
      - name: Prepare the French knowledge base for the browser
        run: cp data/train_corpus.txt docs/knowledge.txt
      - name: Train the browser model on the expanded corpus
        run: python -m loganai.training --steps 800 --batch-size 2 --eval-interval 100 --save-interval 800
      - name: Export model to ONNX
        run: python export_onnx.py
      - name: Validate ONNX model
        run: |
          python - <<'PY'
          import numpy as np
          import onnxruntime as ort
          session = ort.InferenceSession("docs/model.onnx", providers=["CPUExecutionProvider"])
          result = session.run(["logits"], {"input_ids": np.zeros((1, 12), dtype=np.int64)})[0]
          assert result.shape == (1, 12, 256), result.shape
          print("ONNX validé :", result.shape)
          PY
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload static site and model
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
