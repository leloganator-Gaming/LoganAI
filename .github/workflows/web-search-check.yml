name: LoganAI Web search smoke test
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/loganai-web-search/**"
      - "tests/web-search-smoke.mjs"
      - ".github/workflows/web-search-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test live Supabase Web search endpoint
        run: node tests/web-search-smoke.mjs
