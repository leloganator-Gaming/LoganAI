name: Train LoganAI synthesis model

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Nombre d'étapes d'entraînement"
        required: true
        default: "300"
        type: string

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Vérifier les données et l'inférence
        run: pytest -q tests/test_synthesis_training.py tests/test_synthesis_inference.py
      - name: Entraîner le modèle de synthèse depuis zéro
        run: >-
          python -m loganai.synthesis_training
          --steps ${{ inputs.steps }}
          --batch-size 2
          --eval-interval 50
      - name: Conserver les poids entraînés
        uses: actions/upload-artifact@v4
        with:
          name: loganai-synthesis-checkpoint
          path: |
            checkpoints/loganai_synthesis.pt
            checkpoints/loganai_synthesis_state.pt
          if-no-files-found: error
          retention-days: 30
