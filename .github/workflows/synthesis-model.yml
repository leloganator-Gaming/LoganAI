name: Train LoganAI synthesis model

on:
  push:
    branches: [main]
    paths:
      - "loganai/synthesis_training.py"
      - "loganai/synthesis_inference.py"
      - "data/synthesis_train.jsonl"
      - "data/synthesis_validation.jsonl"
      - "tests/test_synthesis_training.py"
      - "tests/test_synthesis_inference.py"
      - ".github/workflows/synthesis-model.yml"
  workflow_dispatch:
    inputs:
      steps:
        description: "Nombre d'étapes d'entraînement"
        required: true
        default: "300"
        type: string

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      SYNTHESIS_STEPS: ${{ github.event.inputs.steps || '300' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Installer PyTorch CPU et pytest
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2
          python -m pip install pytest numpy
      - name: Vérifier les données et l'inférence
        run: pytest -q tests/test_synthesis_training.py tests/test_synthesis_inference.py
      - name: Entraîner le modèle de synthèse depuis zéro
        run: >-
          python -m loganai.synthesis_training
          --steps "$SYNTHESIS_STEPS"
          --batch-size 2
          --eval-interval 50
      - name: Conserver les poids entraînés
        uses: actions/upload-artifact@v4
        with:
          name: loganai-synthesis-checkpoint
          path: |
            checkpoints/loganai_synthesis.pt
            checkpoints/loganai_synthesis_state.pt
          if-no-files-found: error
          retention-days: 30
